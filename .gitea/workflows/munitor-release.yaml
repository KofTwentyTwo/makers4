name: Original Munitor release lifecycle
'on':
  push:
    branches:
    - develop
    - staging
    - main
    - release/**
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  original:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: write
      actions: read
    uses: self:KofTwentyTwo/platform-ci/.gitea/workflows/munitor-release.yaml@kof-release-v1
    with:
      runner: linux-small
      build-runner: browser-build
      image-runner: container-build
      profile: java-webapp
      java-version: '17'
      image: koftwentytwo/makers4
      coverage: '0'
      sast-fail-on-findings: false
      sbom: false
      health-port: '8000'
      health-path: /api/health
